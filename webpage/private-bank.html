<!doctype html>
<html class="no-js" lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>NEXOS Private Bank</title>
    <meta name="description" content="NEXOS Private Bank for Bitcoin holders">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.png">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/animate.min.css">
    <link rel="stylesheet" href="assets/css/fontawesome-all.min.css">
    <link rel="stylesheet" href="assets/css/swiper-bundle.min.css">
    <link rel="stylesheet" href="assets/css/default-icons.css">
    <link rel="stylesheet" href="assets/css/default.css">
    <link rel="stylesheet" href="assets/css/aos.css">
    <link rel="stylesheet" href="assets/css/main.css">
</head>

<body>
    <header id="home">
        <div id="sticky-header" class="tg-header__area transparent-header">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <div class="tgmenu__wrap">
                            <nav class="tgmenu__nav">
                                <div class="logo">
                                    <a href="index.html" class="flex items-center gap-2">
                                        <img src="../frontend/logoooo.png" alt="NEXOS Logo" class="h-10 w-auto">
                                      
                                    </a>
                                </div>
                                <div class="tgmenu__navbar-wrap tgmenu__main-menu d-none d-lg-flex">
                                    <ul class="navigation">
                                        <li class="active"><a href="index.html" class="section-link">Home</a></li>
                                        <li><a href="#about">About</a></li>
                                        <li><a href="#contact">Contact</a></li>
                                    </ul>
                                </div>
                                <div class="tgmenu__action">
                                    <ul class="list-wrap">
                                        <li class="header-btn">
                                            <a href="login.html" class="tg-btn" aria-label="Login">Login</a>
                                        </li>
                                    </ul>
                                </div>
                                <div class="mobile-nav-toggler" aria-label="Open mobile menu" role="button" tabindex="0">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <line x1="3" y1="7" x2="21" y2="7" />
                                        <line x1="3" y1="12" x2="21" y2="12" />
                                        <line x1="3" y1="17" x2="21" y2="17" />
                                    </svg>
                                </div>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-area fix">
        <section class="banner__area banner__bg" style="background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), url('tt.avif') center/cover no-repeat;">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-xl-7 col-lg-8 col-md-10">
                        <div class="banner__content text-center" style="padding: 120px 0;">
                            <span class="sub-title wow fadeInUp" data-wow-delay=".2s" data-wow-duration="1s">The Members-Only Private Bank For Bitcoin Holders</span>
                            <h2 class="title wow fadeInUp" data-wow-delay=".4s" data-wow-duration="1s">We’ve spent over a decade perfecting banking for those who believe in Bitcoin.</h2>
                            <p class="wow fadeInUp" data-wow-delay=".6s" data-wow-duration="1s">Secure, spend, and grow your wealth with us.</p>
                            <form action="#" class="banner__form wow fadeInUp" data-wow-delay=".8s" data-wow-duration="1s" style="justify-content: center; display: flex; gap: .75rem; flex-wrap: wrap; margin-top: 1.5rem;">
                                <label for="email"><img src="assets/img/icon/envelope.svg" alt=""></label>
                                <input type="email" id="email" placeholder="Business email" required>
                                <button type="submit" class="tg-btn">Become a Member</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
